<!doctype html>
<html><head><meta charset="utf-8"><title>X Planner settings</title>
<style>
body{margin:0;width:360px;padding:16px;background:#0b0d12;color:#e8eaf0;font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
h1{font-size:16px;margin:0 0 8px}
p{color:#8a92a3;font-size:12px;margin:0 0 12px}
label{display:block;color:#8a92a3;font-size:12px;margin-bottom:10px}
input{width:100%;box-sizing:border-box;margin-top:4px;background:#12151c;color:#e8eaf0;border:1px solid #262b36;border-radius:8px;padding:8px}
button{background:#1d9bf0;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
#msg{margin-left:10px;color:#00ba7c;font-size:12px}
a{color:#1d9bf0}
</style></head>
<body>
<h1>X Planner: Schedule</h1>
<p>The Schedule button puts a post into the next free slot of your <a href="https://andzol.github.io/x-planner/" target="_blank">planner</a>. Use the same fine-grained token as the planner (this repo only, Contents: read and write). It is stored in this browser only.</p>
<label>Repository<input id="repo"></label>
<label>GitHub token<input id="token" type="password" autocomplete="off"></label>
<button id="save">Save</button><span id="msg"></span>
<script src="options.js"></script>
</body></html>
